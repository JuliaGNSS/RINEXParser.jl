name: Format
on:
  push:
    branches: [main]
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install pinned formatter
        run: julia -e 'using Pkg; Pkg.add(PackageSpec(name = "JuliaFormatter", version = "2.8.5"))'
      - name: Check formatting
        run: |
          julia -e 'using JuliaFormatter; format(["src", "test", "docs/make.jl"])'
          git diff --exit-code
